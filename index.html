<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Instanschola</title>
    <style>
        body {
            font-family: arial;
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .emscripten {
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        div.emscripten {
            text-align: center;
        }
        div.emscripten_border {
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas.emscripten {
            border: 0 none;
            background-color: #000;
            display: block;
        }
        #emscripten_logo {
            display: inline-block;
            margin: 0;
            padding: 6px;
            width: 265px;
        }
        .spinner {
            height: 30px;
            width: 30px;
            margin: 0;
            margin-top: 20px;
            margin-left: 20px;
            display: inline-block;
            vertical-align: top;
            -webkit-animation: rotation .8s linear infinite;
            -moz-animation: rotation .8s linear infinite;
            -o-animation: rotation .8s linear infinite;
            animation: rotation .8s linear infinite;
            border-left: 5px solid #ebebeb;
            border-right: 5px solid #ebebeb;
            border-bottom: 5px solid #ebebeb;
            border-top: 5px solid #787878;
            border-radius: 100%;
            background-color: #bdd72e;
        }
        @-webkit-keyframes rotation { from {-webkit-transform: rotate(0)} to {-webkit-transform: rotate(360deg)} }
        @-moz-keyframes rotation { from {-moz-transform: rotate(0)} to {-moz-transform: rotate(360deg)} }
        @-o-keyframes rotation { from {-o-transform: rotate(0)} to {-o-transform: rotate(360deg)} }
        @keyframes rotation { from { transform: rotate(0) } to { transform: rotate(360deg) } }
        #status {
            display: inline-block;
            vertical-align: top;
            margin-top: 30px;
            margin-left: 20px;
            font-weight: 700;
            color: #787878;
        }
        #progress {
            height: 20px;
            width: 300px;
        }
        #controls {
            display: inline-block;
            float: right;
            vertical-align: top;
            margin-top: 30px;
            margin-right: 20px;
        }
        #output {
            display: none;
        }
    </style>
</head>
